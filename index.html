<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveTrack Vélo - Suivi en direct</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100vw; }
    #stats {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: rgba(255,255,255,0.9); padding: 10px 15px;
      border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div id="stats">
    <div><b>Vitesse :</b> <span id="speed">0.0</span> km/h</div>
    <div><b>Distance :</b> <span id="distance">0.00</span> km</div>
    <div><b>D+ Total :</b> <span id="elevation">0</span> m</div>
  </div>
  <div id="map"></div>

  <script>
    // ⚠️ METS TES PROPRES CLÉS FIREBASE ICI (trouvables dans ta console Firebase)
    const firebaseConfig = {
      apiKey: "TON_API_KEY",
      authDomain: "TON_PROJECT.firebaseapp.com",
      databaseURL: "https://TON_PROJECT-default-rtdb.firebaseio.com",
      projectId: "TON_PROJECT",
      storageBucket: "TON_PROJECT.appspot.com",
      messagingSenderId: "123456789",
      appId: "TON_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Récupération ID session dans l'URL (?session=XXXXX)
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session');

    // Carte Leaflet
    const map = L.map('map').setView([48.8566, 2.3522], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let routePolyline = L.polyline([], {color: 'blue', weight: 5}).addTo(map);
    let bikeMarker = null;

    if (sessionId) {
      // 1. Écoute du tracé GPS
      db.ref("sessions/" + sessionId + "/points").on("child_added", (snapshot) => {
        const data = snapshot.val();
        const latLng = [data.lat, data.lng];
        
        routePolyline.addLatLng(latLng);

        if (!bikeMarker) {
          bikeMarker = L.marker(latLng).addTo(map);
        } else {
          bikeMarker.setLatLng(latLng);
        }
        map.panTo(latLng);
      });

      // 2. Écoute des Stats globales
      db.ref("sessions/" + sessionId + "/info").on("value", (snapshot) => {
        const data = snapshot.val();
        if (data) {
          document.getElementById("speed").innerText = (data.currentSpeed || 0).toFixed(1);
          document.getElementById("distance").innerText = ((data.totalDistance || 0) / 1000).toFixed(2);
          document.getElementById("elevation").innerText = (data.elevationGain || 0).toFixed(0);
        }
      });

      // 3. Écoute des Photos et Commentaires
      db.ref("sessions/" + sessionId + "/messages").on("child_added", (snapshot) => {
        const data = snapshot.val();
        let content = "";
        if (data.image) content += `<img src="data:image/jpeg;base64,${data.image}" style="max-width:200px; display:block; margin-bottom:5px;"/>`;
        if (data.text) content += `<div>${data.text}</div>`;

        if (content) {
          L.marker([data.lat, data.lng]).addTo(map).bindPopup(content);
        }
      });
    } else {
      alert("Aucune session spécifiée dans l'URL !");
    }
  </script>
</body>
</html>
