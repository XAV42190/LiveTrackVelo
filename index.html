<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveTrack Vélo - Spectateur</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100vw; z-index: 1; }

    #stats {
      position: absolute; top: 12px; right: 12px; z-index: 1000;
      background: rgba(255, 255, 255, 0.95); padding: 10px 14px;
      border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      font-size: 13px; color: #1e293b;
    }
    #stats span { font-weight: bold; color: #2563eb; }

    #imageModal {
      display: none; position: fixed; z-index: 9999;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.85);
      justify-content: center; align-items: center;
    }
    #imageModal img { max-width: 90%; max-height: 90%; border-radius: 8px; }
  </style>
</head>
<body>

  <div id="stats">
    <div>🚴🏼‍♂️ <b>Vitesse :</b> <span id="statAvgSpeed">0.0</span> km/h</div>
    <div>📏 <b>Distance :</b> <span id="statDistance">0.00</span> km</div>
    <div>⛰️ <b>D+ Total :</b> <span id="statElevation">0</span> m</div>
  </div>

  <div id="map"></div>

  <div id="imageModal" onclick="closeImageModal()">
    <img id="fullSizeImage" src="" alt="Photo" />
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBE-6F7c2rF-f5DQDv3D9Wiu9l1eiNbY0s",
      authDomain: "suivisortievelo.firebaseapp.com",
      databaseURL: "https://suivisortievelo-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "suivisortievelo",
      storageBucket: "suivisortievelo.firebasestorage.app",
      messagingSenderId: "286724342837",
      appId: "1:286724342837:web:89c3838de2393123f31d7c",
      measurementId: "G-PQ9MQX0DQ5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session');

    const map = L.map('map').setView([46.603354, 1.888334], 6);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    let polyline = L.polyline([], { color: '#2563eb', weight: 5, opacity: 0.9 }).addTo(map);
    let bikeMarker = null;

    if (!sessionId) {
      alert("⚠️ Pas de paramètre ?session=XXXX dans l'URL !");
    } else {
      
      // Traitement centralisé des points GPS
      function handlePoint(data) {
        if (data && data.lat !== undefined && data.lng !== undefined) {
          const latLng = [data.lat, data.lng];
          polyline.addLatLng(latLng);

          if (!bikeMarker) {
            const bikeIcon = L.divIcon({
              className: 'custom-bike-icon',
              html: '<div style="font-size: 26px;">🚴🏼‍♂️</div>',
              iconSize: [30, 30],
              iconAnchor: [15, 15]
            });
            bikeMarker = L.marker(latLng, { icon: bikeIcon }).addTo(map);
            map.setView(latLng, 15);
          } else {
            bikeMarker.setLatLng(latLng);
            map.panTo(latLng);
          }
        }
      }

      // Écoute sur les 2 formats de noeud possibles pour les points GPS
      db.ref("livetrack/sessions/" + sessionId + "/pts").on("child_added", (s) => handlePoint(s.val()));
      db.ref("sessions/" + sessionId + "/points").on("child_added", (s) => handlePoint(s.val()));

      // Écoute des Stats
      function handleInfo(data) {
        if (data) {
          if (data.currentSpeed !== undefined) document.getElementById("statAvgSpeed").innerText = Number(data.currentSpeed).toFixed(1);
          if (data.totalDistance !== undefined) document.getElementById("statDistance").innerText = (Number(data.totalDistance) / 1000).toFixed(2);
          if (data.elevationGain !== undefined) document.getElementById("statElevation").innerText = Math.round(data.elevationGain);
        }
      }
      db.ref("livetrack/sessions/" + sessionId + "/info").on("value", (s) => handleInfo(s.val()));
      db.ref("sessions/" + sessionId + "/info").on("value", (s) => handleInfo(s.val()));

      // Écoute des Photos et Commentaires
      function handleMessage(item) {
        if (!item || item.lat === undefined || item.lng === undefined) return;

        const hasPhoto = Boolean(item.image || item.photo);
        const text = item.text || item.note || '';
        const badge = hasPhoto ? '📸 ' : '💬 ';

        const customIcon = L.divIcon({
          className: 'custom-msg-icon',
          html: `<div style="background-color: #ef4444; color: white; padding: 4px 8px; border-radius: 12px; font-weight: bold; font-size: 11px; border: 2px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.3); white-space: nowrap;">
                  ${badge}${text ? text.substring(0, 15) : 'Photo'}
                 </div>`,
          iconSize: [100, 26],
          iconAnchor: [50, 13]
        });

        const marker = L.marker([item.lat, item.lng], { icon: customIcon }).addTo(map);

        let popupContent = `<div style="text-align:center; min-width: 120px;">`;
        if (text) popupContent += `<b>${text}</b><br>`;
        
        const photoSrc = item.image ? (item.image.startsWith('data:') ? item.image : 'data:image/jpeg;base64,' + item.image) : item.photo;
        if (photoSrc) {
          popupContent += `<img src="${photoSrc}" onclick="openImageModal('${photoSrc}')" style="max-width:180px; max-height:180px; border-radius:6px; margin-top:6px; cursor:pointer;" />`;
        }
        popupContent += `</div>`;

        marker.bindPopup(popupContent);
      }

      db.ref("livetrack/sessions/" + sessionId + "/comments").on("child_added", (s) => handleMessage(s.val()));
      db.ref("livetrack/sessions/" + sessionId + "/messages").on("child_added", (s) => handleMessage(s.val()));
      db.ref("sessions/" + sessionId + "/messages").on("child_added", (s) => handleMessage(s.val()));
    }

    function openImageModal(src) {
      document.getElementById('fullSizeImage').src = src;
      document.getElementById('imageModal').style.display = 'flex';
    }

    function closeImageModal() {
      document.getElementById('imageModal').style.display = 'none';
    }
  </script>
</body>
</html>
